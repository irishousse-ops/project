<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRISALIA | سلة الشراء</title>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #121212;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            animation: fadeIn 0.6s ease-out;
        }
        h1 {
            color: #c5a059;
            text-align: center;
        }
        .cart-container {
            max-width: 800px;
            margin: 20px auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #333;
            animation: fadeIn 0.4s ease-out;
        }
        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
        }
        .delete-btn:hover {
            background-color: #cc0000;
            transform: scale(1.05);
        }
        .total-section {
            text-align: left;
            color: #c5a059;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
        .back-btn {
            display: block;
            width: 200px;
            margin: 30px auto;
            text-align: center;
            background: #c5a059;
            color: #121212;
            padding: 12px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s, transform 0.2s;
        }
        .back-btn:hover {
            background: #d4af37;
            transform: scale(1.05);
        }
        .empty-msg {
            text-align: center;
            color: #888;
            font-size: 16px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>🛒 سلة المشتريات الخاصة بك</h1>
    
    <div class="cart-container" id="cart-list">
        <!-- يتم تعبئة المنتجات هنا تلقائياً -->
    </div>

    <a href="index.html" class="back-btn">العودة إلى المتجر</a>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let container = document.getElementById('cart-list');
            container.innerHTML = '';
            
            if (cart.length === 0) {
                container.innerHTML = '<p class="empty-msg">سلة الشراء فارغة حالياً.</p>';
                return;
            }

            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                container.innerHTML += `
                    <div class="cart-item">
                        <span><strong>${item.name}</strong></span>
                        <span>${item.price} درهم</span>
                        <button class="delete-btn" onclick="removeItem(${index})">حذف</button>
                    </div>
                `;
            });

            container.innerHTML += `<div class="total-section">المجموع الكلي: ${total} درهم</div>`;
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1); // حذف العنصر المختار حسب رقمه في القائمة
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart(); // تحديث عرض السلة فوراً
        }

        // تشغيل الدالة عند تحميل الصفحة
        loadCart();
    </script>
</body>
</html>
