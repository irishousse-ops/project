<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات | IRISALIA</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #121212;
            color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1a1a1a;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #c5a059;
        }
        header h1 {
            color: #c5a059;
            margin: 0;
            font-size: 24px;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .cart-box {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #333;
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .item-info h4 {
            margin: 0 0 5px 0;
            color: #fff;
            font-size: 16px;
        }
        .item-info p {
            margin: 0;
            color: #c5a059;
            font-weight: bold;
        }
        .remove-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .remove-btn:hover {
            background-color: #ff1a1a;
        }
        .cart-total {
            margin-top: 20px;
            text-align: left;
            font-size: 20px;
            color: #c5a059;
            font-weight: bold;
            padding-top: 15px;
            border-top: 2px solid #c5a059;
        }
        .actions {
            text-align: center;
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #c5a059;
            color: #121212;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #d4af37;
        }
        .whatsapp-btn {
            background-color: #25d366;
            color: white;
        }
        .whatsapp-btn:hover {
            background-color: #20ba5a;
        }
        .empty-cart {
            text-align: center;
            color: #888;
            font-size: 18px;
            padding: 40px 0;
        }
        /* قسم التواصل السفلي */
        footer {
            background-color: #1a1a1a;
            border-top: 2px solid #333;
            padding: 30px 20px;
            text-align: center;
            margin-top: 60px;
        }
        footer h3 {
            color: #c5a059;
            margin-bottom: 10px;
        }
        footer p {
            color: #bbb;
            margin: 5px 0;
            font-size: 14px;
        }
        .contact-links {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .contact-link {
            color: #c5a059;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #c5a059;
            padding: 8px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .contact-link:hover {
            background-color: #c5a059;
            color: #121212;
        }
    </style>
</head>
<body>

    <header>
        <h1>🛒 سلة المشتريات الخاصة بك - IRISALIA</h1>
    </header>

    <div class="container">
        <div class="cart-box" id="cartContainer">
            <!-- سيتم تعبئة السلة تلقائياً عبر الجافاسكريبت -->
        </div>

        <div class="actions">
            <a href="index.html" class="btn">العودة إلى المتجر</a>
            <button onclick="sendOrderWhatsApp()" class="btn whatsapp-btn" id="whatsappOrderBtn" style="display: none;">📲 إرسال الطلب عبر الواتساب</button>
        </div>
    </div>

    <!-- قسم التواصل ومعلومات المتجر -->
    <footer>
        <h3>تواصل معنا - IRISALIA</h3>
        <p>📧 البريد الإلكتروني: contact.irisalia@gmail.com</p>
        <p>📞 الهاتف / واتساب: +212 684354525</p>
        <div class="contact-links">
            <a href="https://wa.me/212684354525?text=مرحباً، أنا قادم من متجر IRISALIA وأريد الاستفسار عن العطور." target="_blank" class="contact-link">💬 تواصل عبر الواتساب</a>
            <a href="mailto:contact.irisalia@gmail.com?subject=استفسار من متجر IRISALIA" class="contact-link">✉️ مراسلة عبر البريد</a>
        </div>
        <p style="margin-top: 20px; font-size: 12px; color: #666;">© 2026 IRISALIA - جميع الحقوق محفوظة</p>
    </footer>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let container = document.getElementById('cartContainer');
            let whatsappBtn = document.getElementById('whatsappOrderBtn');
            
            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-cart">سلة المشتريات فارغة حالياً 🛍️</div>';
                whatsappBtn.style.display = 'none';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                html += `
                    <div class="cart-item">
                        <div class="item-info">
                            <h4>${item.name}</h4>
                            <p>${item.price} درهم</p>
                        </div>
                        <button class="remove-btn" onclick="removeItem(${index})">حذف</button>
                    </div>
                `;
            });

            html += `<div class="cart-total">المجموع الكلي: ${total} درهم (مع التوصيل المجاني 🚚)</div>`;
            container.innerHTML = html;
            whatsappBtn.style.display = 'inline-block';
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        function sendOrderWhatsApp() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) return;

            let message = "مرحباً، أنا قادم من متجر IRISALIA وأريد إتمام طلب العطور التالية:\n\n";
            let total = 0;

            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} - ${item.price} درهم\n`;
                total += item.price;
            });

            message += `\nالمجموع الكلي: ${total} درهم\nالاستفادة من التوصيل المجاني (Livraison Gratuite).`;

            let phone = "212684354525"; // رقم الهاتف الخاص بك
            let url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        loadCart();
    </script>
</body>
</html>
